[project]
name = "graded-resonators"
version = "0.1.0"
description = "Reproduction of BRF and controlled studies of graded resonator emissions"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jax==0.6.2", "numpy==2.2.6", "scipy==1.15.3", "h5py==3.14.0",
  "matplotlib==3.10.3",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]==0.6.2"]
test = ["pytest==8.4.1", "torch==2.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graded_resonators"]

[tool.pytest.ini_options]
testpaths = ["tests"]

